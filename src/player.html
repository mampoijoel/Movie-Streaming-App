<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- We add autoplay=1 to play instantly, and rel=0 to stop recommended videos at the end -->
    <iframe id="ytplayer" 
            src="https://www.youtube.com/embed/%VIDEO_ID%?autoplay=1&controls=0&rel=0&showinfo=0&modestbranding=1&playsinline=1" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>
</body>
</html>
